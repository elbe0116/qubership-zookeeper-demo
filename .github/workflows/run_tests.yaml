name: Run Zookeeper Pipeline

permissions:
  contents: read
  packages: read
  actions: read

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "CODE-OF-CONDUCT.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "README.md"
      - "SECURITY.md"
  push:
    branches:
      - "**"
    paths-ignore:
      - "docs/**"
      - "CODE-OF-CONDUCT.md"
      - "CONTRIBUTING.md"
      - "LICENSE"
      - "README.md"
      - "SECURITY.md"
  workflow_dispatch:
    inputs:
      repository_name:
        description: Repository with ZooKeeper service (use your fork if the branch exists only there)
        required: false
        type: string
        default: ""
      service_branch:
        description: Branch of the ZooKeeper service repo to test
        required: false
        type: string
        default: main
      integration_tests_tags:
        description: Robot integrationTests.tags (env TAGS), e.g. zookeeperNOTtransactional_backup. Leave empty for template defaults.
        required: false
        type: string
        default: ""

jobs:
  Wait-for-images:
    runs-on: ubuntu-latest
    outputs:
      conclusion: ${{ steps.wait.outputs.conclusion }}
    steps:
      - name: Wait for dev_build.yml to complete
        if: github.event_name != 'workflow_dispatch'
        uses: netcracker/qubership-workflow-hub/actions/wait-for-workflow@396774180000abdb825cbf150b56cc59c6913db8  #v2.0.5
        id: wait
        with:
          workflow: dev_build.yml
          token: ${{ secrets.GITHUB_TOKEN }}
          poll-interval: 20
  Zookeeper-Pipeline:
    needs: Wait-for-images
    # Pinned fork: ATP S3 creds via helm_deploy --set-string; repo secrets S3_AWS_* mapped to workflow_call secrets.
    uses: elbe0116/qubership-test-pipelines/.github/workflows/zookeeper.yaml@40c6c95927e11ecf1038e0489eba9f6cf2817ec2
    with:
      # Same repo as the workflow: chart + dev_build images (GHCR under this org). Override via workflow_dispatch if needed.
      repository_name: ${{ github.event_name == 'workflow_dispatch' && (inputs.repository_name != '' && inputs.repository_name || github.repository) || github.repository }}
      service_branch: ${{ github.event_name == 'workflow_dispatch' && inputs.service_branch || (github.head_ref || github.ref_name) }}
      pipeline_branch: '40c6c95927e11ecf1038e0489eba9f6cf2817ec2'
      test_tags: ${{ github.event_name == 'workflow_dispatch' && inputs.integration_tests_tags || '' }}
    secrets:
      AWS_S3_ACCESS_KEY_ID: ${{ secrets.S3_AWS_ACCESS_KEY_ID }}
      AWS_S3_ACCESS_KEY_SECRET: ${{ secrets.S3_AWS_SECRET_ACCESS_KEY }}
